services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fm_user
      POSTGRES_PASSWORD: fm_local_password
      POSTGRES_DB: fm_central
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fm_user -d fm_central"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fm_mcp_postgres:/var/lib/postgresql/data

  api:
    build: .
    command: ["fm-workflow-api"]
    environment:
      FM_ENV: development
      DATABASE_URL: postgresql+asyncpg://fm_user:fm_local_password@postgres:5432/fm_central
      FM_WORKFLOW_API_AUDIENCE: fm-workflow-api
      FM_SMTP_HOST: mailpit
      FM_SMTP_PORT: "1025"
      FM_SMTP_FROM_ADDRESS: fm-workflow@example.test
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build: .
    command: ["./scripts/migrate.sh"]
    environment:
      FM_ENV: development
      DATABASE_URL: postgresql+asyncpg://fm_user:fm_local_password@postgres:5432/fm_central
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  mcp:
    build: .
    command: ["fm-mcp"]
    environment:
      FM_ENV: development
      FM_WORKFLOW_API_URL: http://api:8000
      FM_API_TIMEOUT: "30"
      FM_MCP_DEV_USER_ID: local-developer
      FM_MCP_DEV_ROLES: fm_admin
      FM_MCP_TRANSPORT: streamable-http
      FM_MCP_HOST: 0.0.0.0
      FM_MCP_PORT: "8000"
      FM_MCP_PATH: /mcp
    ports:
      - "127.0.0.1:${FM_MCP_HOST_PORT:-8003}:8000"
    depends_on:
      api:
        condition: service_started

  scheduler:
    build: .
    command: ["python", "scripts/evaluate_escalations.py"]
    environment:
      FM_ENV: development
      DATABASE_URL: postgresql+asyncpg://fm_user:fm_local_password@postgres:5432/fm_central
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  dispatcher:
    build: .
    command: ["python", "scripts/dispatch_notifications.py"]
    environment:
      FM_ENV: development
      DATABASE_URL: postgresql+asyncpg://fm_user:fm_local_password@postgres:5432/fm_central
      FM_SMTP_HOST: mailpit
      FM_SMTP_PORT: "1025"
      FM_SMTP_FROM_ADDRESS: fm-workflow@example.test
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    profiles: ["tools"]

  mailpit:
    image: axllent/mailpit:v1.29.0
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  fm_mcp_postgres:
