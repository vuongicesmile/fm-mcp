services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fm_user
      POSTGRES_PASSWORD: fm_local_password
      POSTGRES_DB: fm_central
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fm_user -d fm_central"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - fm_mcp_postgres:/var/lib/postgresql/data

  api:
    build: .
    command: ["fm-workflow-api"]
    environment:
      FM_ENV: development
      DATABASE_URL: postgresql+asyncpg://fm_user:fm_local_password@postgres:5432/fm_central
      FM_WORKFLOW_API_AUDIENCE: fm-workflow-api
      FM_SMTP_HOST: mailpit
      FM_SMTP_PORT: "1025"
      FM_SMTP_FROM_ADDRESS: fm-workflow@example.test
      FM_REQUEST_NOTIFICATION_EMAIL: ${FM_REQUEST_NOTIFICATION_EMAIL:-fm-requests@example.test}
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build: .
    command: ["./scripts/migrate.sh"]
    environment:
      FM_ENV: development
      DATABASE_URL: postgresql+asyncpg://fm_user:fm_local_password@postgres:5432/fm_central
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  mcp:
    build: .
    command: ["fm-mcp-http"]
    environment:
      FM_ENV: development
      FM_WORKFLOW_API_URL: http://api:8000
      FM_API_TIMEOUT: "30"
      FM_MCP_DEV_USER_ID: local-developer
      FM_MCP_DEV_ROLES: fm_admin
      FM_COLLECTOR_ORG_ID: ${FM_COLLECTOR_ORG_ID:-rmit_fm}
      FM_COLLECTOR_SERVICE_URL: http://collector:8021
      FM_COLLECTOR_SERVICE_TOKEN: ${FM_COLLECTOR_SERVICE_TOKEN:-}
      DATABASE_URL: postgresql+asyncpg://fm_user:fm_local_password@postgres:5432/fm_central
      FM_PROFILING_CLICKHOUSE_URL: ${FM_PROFILING_CLICKHOUSE_URL:-http://host.docker.internal:8123}
      FM_PROFILING_CLICKHOUSE_USER: ${FM_PROFILING_CLICKHOUSE_USER:-${CLICKHOUSE_USER:-titan}}
      FM_PROFILING_CLICKHOUSE_PASSWORD: ${FM_PROFILING_CLICKHOUSE_PASSWORD:-${CLICKHOUSE_PASSWORD:-titan-dev}}
      FM_PROFILING_RAW_SCHEMA: ${FM_PROFILING_RAW_SCHEMA:-t_rmit_fm_raw}
      FM_PROFILING_ORG_ID: ${FM_PROFILING_ORG_ID:-rmit_fm}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started
    ports:
      - "8001:8000"

  collector:
    build: .
    command: ["fm-collector-api"]
    restart: unless-stopped
    environment:
      FM_COLLECTOR_ORG_ID: ${FM_COLLECTOR_ORG_ID:-rmit_fm}
      FM_COLLECTOR_SERVICE_TOKEN: ${FM_COLLECTOR_SERVICE_TOKEN:-}
      FM_COLLECTOR_CONTEXT_TOKEN: ${FM_COLLECTOR_CONTEXT_TOKEN:-}
      FM_COLLECTOR_CONTROL_PLANE_URL: http://titan-api:8000
      CAPTURE_RUNNER_TOKEN: ${CAPTURE_RUNNER_TOKEN:-}
      CAPTURE_RUNNER_URL: http://capture-runner:8020
      CAPTURE_PG_HOST: host.docker.internal
      CAPTURE_PG_PORT: ${POSTGRES_PORT:-5432}
      CAPTURE_PG_DATABASE: control_plane
      CAPTURE_PG_USER: ${POSTGRES_USER:-titan}
      CAPTURE_PG_PASSWORD: ${POSTGRES_PASSWORD:-titan-dev}
      TITAN_AIRFLOW_URL: http://airflow-api-server:8080
      TITAN_AIRFLOW_PUBLIC_URL: ${TITAN_AIRFLOW_PUBLIC_URL:-http://localhost:8080}
      TITAN_AIRFLOW_USER: ${TITAN_AIRFLOW_USER:-airflow}
      TITAN_AIRFLOW_PASSWORD: ${TITAN_AIRFLOW_PASSWORD:-}
      TITAN_AIRFLOW_TOKEN: ${TITAN_AIRFLOW_TOKEN:-}
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [default, titan-data]
    ports: ["127.0.0.1:8021:8021"]

  scheduler:
    build: .
    command: ["python", "scripts/evaluate_escalations.py"]
    environment:
      FM_ENV: development
      DATABASE_URL: postgresql+asyncpg://fm_user:fm_local_password@postgres:5432/fm_central
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  dispatcher:
    build: .
    command: ["python", "scripts/run_notification_dispatcher.py"]
    restart: unless-stopped
    environment:
      FM_ENV: development
      DATABASE_URL: postgresql+asyncpg://fm_user:fm_local_password@postgres:5432/fm_central
      FM_SMTP_HOST: mailpit
      FM_SMTP_PORT: "1025"
      FM_SMTP_FROM_ADDRESS: fm-workflow@example.test
      FM_REQUEST_NOTIFICATION_EMAIL: ${FM_REQUEST_NOTIFICATION_EMAIL:-fm-requests@example.test}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
  mailpit:
    image: axllent/mailpit:v1.29.0
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  fm_mcp_postgres:

networks:
  titan-data:
    external: true
    name: ${TITAN_DATA_NETWORK:-titan-data_default}
