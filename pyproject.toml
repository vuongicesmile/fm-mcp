[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fm-mcp"
version = "0.1.0"
description = "FM Workflow Automation API and MCP adapter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0.0",
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.30.0,<1.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "sqlalchemy[asyncio]>=2.0.0,<3.0",
  "asyncpg>=0.29.0,<1.0",
  "alembic>=1.13.0,<2.0",
  "PyJWT>=2.8.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[project.scripts]
fm-mcp = "fm_mcp.main:main"
fm-workflow-api = "fm_mcp.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/fm_mcp"]
