name: Migration validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  upgrade-empty-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fm_mcp_test
        options: >-
          --health-cmd "pg_isready -U postgres -d fm_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      FM_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fm_mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install module dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Load FastAPI application
        run: python -c "from fm_mcp.api.main import app; assert app.title == 'FM Workflow Automation API'"
      - name: Load MCP tool registry
        run: python -c "from fm_mcp.server import mcp; assert mcp is not None"
      - name: Validate Compose and build image
        run: docker compose -f compose.yml config && docker build -t fm-mcp-ci .
      - name: Upgrade isolated PostgreSQL database
        run: ./scripts/migrate.sh
      - name: Verify migrated FM table inventory
        env:
          PGPASSWORD: postgres
        run: |
          expected="$(python -c "from fm_mcp.domain import models; from fm_mcp.infrastructure.database import Base; print('\n'.join(sorted(Base.metadata.tables)))")"
          actual="$(psql -h localhost -U postgres -d fm_mcp_test -Atc "SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND left(table_name, 3) = 'fm_' ORDER BY table_name;")"
          if [ "$actual" != "$expected" ]; then
            printf 'Expected tables:\n%s\nActual tables:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          psql -h localhost -U postgres -d fm_mcp_test -c "SELECT version_num FROM alembic_version_fm_mcp"
