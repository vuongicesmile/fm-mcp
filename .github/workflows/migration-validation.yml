name: Migration validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  upgrade-empty-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fm_mcp_test
        options: >-
          --health-cmd "pg_isready -U postgres -d fm_mcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      FM_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/fm_mcp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install module dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Upgrade isolated PostgreSQL database
        run: ./scripts/migrate.sh
      - name: Verify EPIC 3 table inventory
        env:
          PGPASSWORD: postgres
        run: |
          actual="$(psql -h localhost -U postgres -d fm_mcp_test -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name LIKE 'fm_%';")"
          test "$actual" -eq 15
          psql -h localhost -U postgres -d fm_mcp_test -c "SELECT version_num FROM alembic_version_fm_mcp"
